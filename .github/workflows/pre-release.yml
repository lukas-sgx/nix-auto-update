name: Pre-Release

on:
  workflow_run:
    workflows: ["nix-auto-update - CI"]
    types: [completed]
    branches: [staging]

jobs:
  release:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      release_created: ${{ steps.pre-release.outputs.release_created }}
      tag_name: ${{ steps.pre-release.outputs.tag_name }}

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: googleapis/release-please-action@v5
        id: pre-release
        with:
          target-branch: staging
          config-file: release-config.json
          manifest-file: .release-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.pre-release.outputs.release_created }}
        with:
          fetch-depth: 0
          ref: staging


  build-deploy:
    runs-on: "ubuntu-latest"
    needs: release
    if: ${{ needs.release.outputs.release_created }}

    permissions:
      id-token: write

    
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: pip install -r requirements.txt
      
      - name: Build
        run: pipx run build

      - name: Push Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nix-auto-update-v${{ needs.release.outputs.tag_name }}
          path: dist/*
          retention-days: 5

  open_pull_request:
      if: github.ref_name == 'staging' && github.event_name == 'push'
      needs:
        - build-deploy
      runs-on: ubuntu-latest
      permissions:
        pull-requests: write
        contents: read
      steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0

        - name: Check diff commits
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            AHEAD_COMMITS=$(gh api repos/${{ github.repository }}/compare/stable...${{ github.ref_name }} --jq '.ahead_by')

            if [ "$AHEAD_COMMITS" -eq 0 ]; then
              exit 0
            fi
  
        - name: Create or Update PR
          env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          run: |
            BASE_BRANCH="stable"
            COMPARE_TARGET="origin/stable"

            BACKLINE=$'\n'
            COMMITS_LIST="### List of changements:${BACKLINE}"
            COMMITS_LIST+="$(git log ${COMPARE_TARGET}..HEAD --oneline --pretty=format:"- %s (%h)")"

            gh pr create \
              --title "merge: ${{ github.ref_name }} -> ${BASE_BRANCH}" \
              --body "$COMMITS_LIST" \
              --base "$BASE_BRANCH" \
              --head "${{ github.ref_name }}" || {
                
                PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --base "$BASE_BRANCH" --json "number" -q '.[0].number')
        
                if [ -n "$PR_NUMBER" ]; then
                    gh pr edit "$PR_NUMBER" --body "$COMMITS_LIST"
                else
                    exit 0
                fi
            }
