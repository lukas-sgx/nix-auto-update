name: Pre-Release

on:
  workflow_run:
    workflows: ["nix-auto-update - CI"]
    types: [completed]
    branches: [staging]

jobs:
  release:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    outputs:
      release_created: ${{ steps.pre-release.outputs.release_created }}
      tag_name: ${{ steps.pre-release.outputs.tag_name }}

    permissions:
      contents: write
      pull-requests: write
      id-token: write
      issues: write

    steps:
      - uses: googleapis/release-please-action@v5
        id: pre-release
        with:
          target-branch: staging
          config-file: release-config.json
          manifest-file: .release-manifest.json

      - uses: actions/checkout@v7
        if: ${{ steps.pre-release.outputs.release_created }}
        with:
          fetch-depth: 0
          ref: staging


  build-deploy:
    runs-on: "ubuntu-latest"
    needs: release
    if: ${{ needs.release.outputs.release_created }}
    
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: pip install -r requirements.txt
      
      - name: Build
        run: pipx run build

      - name: Push Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nix-auto-update-v${{ needs.release.outputs.tag_name }}
          path: dist/*
          retention-days: 5

      - name: Publish to PyPI
        if: ${{ needs.release.outputs.release_created }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/